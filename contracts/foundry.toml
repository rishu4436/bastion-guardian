# BASTION Guardian — Foundry configuration
# Solidity pinned to 0.8.29: reactive-lib-omni v0.1.0 declares `pragma solidity ^0.8.29`.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.29"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = true
fs_permissions = [{ access = "read-write", path = "./out-evidence" }]
remappings = [
  "@reactive/=lib/reactive-lib-omni/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 512
seed = "0xb457"

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 256
depth = 96

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC_URL}"
lasna = "${REACTIVE_LASNA_RPC_URL}"

[lint]
lint_on_build = false
# Timestamps are intentional: Base Sepolia produces 200ms blocks, so the hackathon rules require timestamp-based timers.
exclude_lints = ["block-timestamp"]
